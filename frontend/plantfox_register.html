<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="config.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PlantFox — Create Account</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#16a34a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PlantFox">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;0,9..40,900;1,9..40,400&display=swap" rel="stylesheet">
<style>
:root {
  --gr-50:#eef8f2;--gr-100:#d1f0de;--gr-200:#a3dfc0;--gr-300:#5cc68a;
  --gr-400:#28a85a;--gr-500:#16a34a;--gr-600:#14813b;--gr-700:#0e5e2b;
  --fox-500:#ea6d1e;--fox-600:#c45512;
  --ink:#1a1a1a;--ink2:#3d3d3d;--ink3:#7a7a7a;--ink4:#b8b8b8;
  --bg:#eef8f2;
  --border:rgba(22,163,74,.15);--border2:rgba(22,163,74,.25);
  --clay-sm:0 2px 0 rgba(0,0,0,.07),0 4px 12px rgba(0,0,0,.06);
  --clay-xl:0 4px 0 rgba(0,0,0,.09),0 12px 40px rgba(0,0,0,.10);
  --clay-green:0 3px 0 rgba(14,94,43,.45),0 8px 24px rgba(22,163,74,.2);
  --r:16px;--r-lg:22px;--r-xl:28px;--r-2xl:40px;--r-pill:999px;
  --font:'DM Sans',sans-serif;
  --ease-clay:cubic-bezier(.34,1.56,.64,1);
  --ease-out:cubic-bezier(.16,1,.3,1);
  --transition:.2s ease;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{font-size:16px;}
body{
  font-family:var(--font);background:var(--bg);color:var(--ink);
  min-height:100vh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:20px;position:relative;overflow-x:hidden;
}
body::before{content:'';position:fixed;top:-100px;right:-100px;width:500px;height:500px;background:radial-gradient(circle,rgba(34,197,94,.12) 0%,transparent 70%);border-radius:50%;pointer-events:none;z-index:0;}
body::after{content:'';position:fixed;bottom:-80px;left:-80px;width:400px;height:400px;background:radial-gradient(circle,rgba(249,115,22,.08) 0%,transparent 70%);border-radius:50%;pointer-events:none;z-index:0;}

/* Back nav */
.auth-nav{position:fixed;top:16px;left:16px;z-index:50;}
.auth-nav__back{
  display:inline-flex;align-items:center;gap:6px;
  font-size:.82rem;font-weight:700;color:var(--ink3);
  background:white;border:1px solid var(--border2);
  padding:7px 14px;border-radius:var(--r-pill);
  box-shadow:var(--clay-sm);transition:var(--transition);
  text-decoration:none;cursor:pointer;
  font-family:var(--font);
}
.auth-nav__back:hover{color:var(--gr-700);border-color:var(--gr-400);}

/* Card */
.auth-card{
  background:white;border-radius:var(--r-2xl);
  box-shadow:var(--clay-xl);
  width:100%;max-width:440px;
  overflow:hidden;border:1px solid var(--border);
  position:relative;z-index:1;
  animation:cardIn .5s var(--ease-clay) both;
}
@keyframes cardIn{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}

/* Progress strip */
.auth-strip{height:4px;background:var(--border);}
.auth-strip-fill{
  height:100%;
  background:linear-gradient(90deg,var(--gr-500),var(--gr-300));
  width:33%;transition:width .5s var(--ease-out);
}

/* Step label */
.step-label{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 24px;
  font-size:.75rem;font-weight:700;color:var(--ink3);
}
.step-count{
  font-size:.7rem;font-weight:700;
  background:var(--gr-50);color:var(--gr-700);
  padding:2px 8px;border-radius:var(--r-pill);
  border:1px solid var(--gr-100);
}

/* Body */
.auth-body{padding:12px 28px 28px;}
.auth-header{text-align:center;margin-bottom:16px;}

.fox-avatar{
  font-size:2.5rem;display:block;text-align:center;
  margin-bottom:8px;animation:float 3s ease-in-out infinite;
}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

.auth-title{font-size:1.4rem;font-weight:900;margin:10px 0 4px;}
.auth-subtitle{color:var(--ink3);font-size:.875rem;line-height:1.5;}

/* Pills */
.auth-pills{
  display:flex;gap:6px;flex-wrap:wrap;justify-content:center;
  margin-bottom:14px;
}
.pill{
  font-size:.72rem;font-weight:700;
  background:var(--gr-50);color:var(--gr-700);
  border:1px solid var(--gr-100);
  padding:4px 11px;border-radius:var(--r-pill);
}

/* Error / Success */
.auth-error{
  background:#FEF2F2;border:1px solid #FECACA;
  border-radius:12px;padding:10px 14px;
  font-size:.82rem;color:#B91C1C;
  margin-bottom:14px;display:none;
}
.auth-error.show{display:block;}
.auth-success{
  display:flex;align-items:center;gap:7px;
  background:var(--gr-50);border:1px solid var(--gr-100);
  border-radius:12px;padding:9px 14px;
  font-size:.8rem;font-weight:700;color:var(--gr-700);
  margin-bottom:14px;
}

/* Form */
.auth-form{display:flex;flex-direction:column;gap:12px;}
.auth-field{display:flex;flex-direction:column;gap:5px;}
.auth-label{font-size:.75rem;letter-spacing:.02em;font-weight:700;color:var(--ink2);}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
@media(max-width:420px){.form-row{grid-template-columns:1fr;}}
.auth-input-wrap{position:relative;}
.auth-input-icon{
  position:absolute;left:13px;top:50%;transform:translateY(-50%);
  color:var(--ink4);display:flex;align-items:center;font-size:1rem;
  pointer-events:none;
}
.auth-input-icon.right{left:auto;right:13px;pointer-events:all;cursor:pointer;background:none;border:none;}
.auth-input{
  width:100%;padding:10px 44px 10px 42px;
  border:1.5px solid var(--border2);border-radius:12px;
  font-size:.9rem;font-family:var(--font);
  background:white;color:var(--ink);outline:none;
  transition:border-color .2s,box-shadow .2s;
}
.auth-input:focus{border-color:var(--gr-500);box-shadow:0 0 0 3px rgba(22,163,74,.12);}
.auth-input::placeholder{color:var(--ink4);}

/* OTP input */
.otp-input{
  text-align:center;font-size:1.8rem;font-weight:800;
  letter-spacing:.25em;padding-left:16px!important;
}

/* Password strength */
.pw-strength{display:flex;gap:4px;margin-top:6px;}
.pw-bar{flex:1;height:4px;border-radius:var(--r-pill);background:var(--border2);transition:background .3s;}
.pw-bar.weak{background:#F87171;}
.pw-bar.fair{background:#FBBF24;}
.pw-bar.strong{background:var(--gr-500);}

/* Buttons */
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  padding:11px 24px;border-radius:var(--r-pill);
  font-size:.875rem;font-weight:800;cursor:pointer;
  transition:var(--transition);border:none;font-family:var(--font);
  letter-spacing:.03em;width:100%;
}
.btn-primary{
  background:var(--gr-500);color:white;
  box-shadow:0 4px 0 var(--gr-700),var(--clay-green);margin-top:8px;
}
.btn-primary:hover:not(:disabled){background:var(--gr-700);transform:translateY(-1px);}
.btn-primary:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--gr-700);}
.btn-primary:disabled{opacity:.6;cursor:not-allowed;transform:none;}
.btn-outline{
  background:white;color:var(--ink2);
  border:1.5px solid var(--border2);box-shadow:var(--clay-sm);
}
.btn-outline:hover{border-color:var(--gr-500);color:var(--gr-700);background:var(--gr-50);}
.btn-ghost{
  background:none;border:none;cursor:pointer;
  color:var(--ink3);font-size:.8rem;font-weight:600;
  text-align:center;margin-top:6px;font-family:var(--font);
  transition:color .2s;padding:4px;
}
.btn-ghost:hover{color:var(--gr-700);}
.btn-ghost:disabled{opacity:.5;cursor:not-allowed;}

.spinner{
  width:18px;height:18px;
  border:2px solid rgba(255,255,255,.4);
  border-top-color:white;border-radius:50%;
  display:inline-block;animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

.auth-footer{margin-top:20px;text-align:center;}
.auth-footer-text{font-size:.82rem;color:var(--ink3);margin-bottom:10px;}

/* Step panels */
.step-panel{display:none;}
.step-panel.active{display:block;animation:stepIn .3s var(--ease-out) both;}
@keyframes stepIn{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:none}}
</style>
</head>
<body>

<nav class="auth-nav">
  <button class="auth-nav__back" id="back-btn" onclick="goBack()">← Back</button>
</nav>

<div class="auth-card">
  <!-- Progress strip -->
  <div class="auth-strip"><div class="auth-strip-fill" id="strip-fill"></div></div>

  <!-- Step label -->
  <div class="step-label">
    <span id="step-name">Your details</span>
    <span class="step-count" id="step-count">1 / 3</span>
  </div>

  <div class="auth-body">
    <!-- Header -->
    <div class="auth-header">
      <span class="fox-avatar" id="avatar">🦊</span>
      <h1 class="auth-title" id="step-title">Create your profile</h1>
      <p class="auth-subtitle" id="step-subtitle">Start your growing journey — it's free!</p>
    </div>

    <!-- Pills (step 1 only) -->
    <div class="auth-pills" id="pills">
      <span class="pill">🌱 Plant your first seed</span>
      <span class="pill">🦊 Meet Foxie AI</span>
      <span class="pill">🏆 Earn rewards</span>
    </div>

    <!-- Error -->
    <div class="auth-error" id="reg-error"></div>

    <!-- STEP 1: Details -->
    <div class="step-panel active" id="step-details">
      <form class="auth-form" onsubmit="doSendOtp(event)">
        <div class="form-row">
          <div class="auth-field">
            <label class="auth-label" for="reg-fullname">FULL NAME</label>
            <div class="auth-input-wrap">
              <span class="auth-input-icon">👤</span>
              <input id="reg-fullname" class="auth-input" placeholder="John Doe" autocomplete="name">
            </div>
          </div>
          <div class="auth-field">
            <label class="auth-label" for="reg-username">USERNAME *</label>
            <div class="auth-input-wrap">
              <span class="auth-input-icon" style="font-weight:900;font-size:.95rem">@</span>
              <input id="reg-username" class="auth-input" placeholder="john" required autocomplete="username">
            </div>
          </div>
        </div>
        <div class="auth-field">
          <label class="auth-label" for="reg-email">EMAIL ADDRESS *</label>
          <div class="auth-input-wrap">
            <span class="auth-input-icon">✉️</span>
            <input id="reg-email" type="email" class="auth-input" placeholder="you@example.com" required autocomplete="email">
          </div>
        </div>
        <button type="submit" id="otp-btn" class="btn btn-primary">
          <span id="otp-btn-text">SEND VERIFICATION CODE →</span>
          <span id="otp-spinner" class="spinner" style="display:none"></span>
        </button>
      </form>
    </div>

    <!-- STEP 2: OTP -->
    <div class="step-panel" id="step-otp">
      <form class="auth-form" onsubmit="doVerifyOtp(event)">
        <div class="auth-input-wrap">
          <input id="reg-otp" type="text" inputmode="numeric" maxlength="6"
            class="auth-input otp-input" placeholder="· · · · · ·"
            autocomplete="one-time-code">
        </div>
        <button type="submit" id="verify-btn" class="btn btn-primary">
          <span id="verify-btn-text">VERIFY CODE →</span>
          <span id="verify-spinner" class="spinner" style="display:none"></span>
        </button>
        <button type="button" class="btn-ghost" id="resend-btn" onclick="doResend()">
          Didn't receive it? Resend code
        </button>
      </form>
    </div>

    <!-- STEP 3: Password -->
    <div class="step-panel" id="step-password">
      <form class="auth-form" onsubmit="doRegister(event)">
        <div class="auth-success" id="verified-badge">
          ✅ <span id="verified-email"></span> — verified ✓
        </div>

        <div class="auth-field">
          <label class="auth-label" for="reg-pw">PASSWORD</label>
          <div class="auth-input-wrap">
            <span class="auth-input-icon">🔒</span>
            <input id="reg-pw" type="password" class="auth-input"
              placeholder="Min. 8 characters" required autocomplete="new-password"
              oninput="updateStrength(this.value)" style="padding-right:44px">
            <button type="button" class="auth-input-icon right" onclick="togglePw('reg-pw',this)" aria-label="Toggle">👁</button>
          </div>
          <div class="pw-strength">
            <div class="pw-bar" id="bar1"></div>
            <div class="pw-bar" id="bar2"></div>
            <div class="pw-bar" id="bar3"></div>
          </div>
        </div>

        <div class="auth-field">
          <label class="auth-label" for="reg-cpw">CONFIRM PASSWORD</label>
          <div class="auth-input-wrap">
            <span class="auth-input-icon">🔒</span>
            <input id="reg-cpw" type="password" class="auth-input"
              placeholder="Repeat password" required autocomplete="new-password">
            <button type="button" class="auth-input-icon right" onclick="togglePw('reg-cpw',this)" aria-label="Toggle">👁</button>
          </div>
        </div>

        <button type="submit" id="reg-btn" class="btn btn-primary">
          <span id="reg-btn-text">CREATE MY ACCOUNT 🌱</span>
          <span id="reg-spinner" class="spinner" style="display:none"></span>
        </button>
      </form>
    </div>

    <!-- Footer -->
    <div class="auth-footer">
      <p class="auth-footer-text">Already have an account?</p>
      <a href="plantfox_login.html" class="btn btn-outline">LOG IN</a>
    </div>
  </div>
</div>

<script>
const API = `${CONFIG.API}/api`;

// State
let curStep = 'details'; // 'details' | 'otp' | 'password'
let formData = { email:'', username:'', fullName:'', otp:'' };

const STEPS = {
  details:  { strip:'33%',  name:'Your details', count:'1 / 3', avatar:'🦊', title:'Create your profile',  sub:"Start your growing journey — it's free!" },
  otp:      { strip:'66%',  name:'Verify email',  count:'2 / 3', avatar:'🦊', title:'Check your inbox',     sub:'' },
  password: { strip:'100%', name:'Set password',  count:'3 / 3', avatar:'🌱', title:'Almost there!',        sub:'Set a strong password to secure your sanctuary.' }
};

function setStep(step){
  // Hide all panels
  document.querySelectorAll('.step-panel').forEach(p => p.classList.remove('active'));
  document.getElementById(`step-${step}`).classList.add('active');

  const s = STEPS[step];
  document.getElementById('strip-fill').style.width = s.strip;
  document.getElementById('step-name').textContent  = s.name;
  document.getElementById('step-count').textContent = s.count;
  document.getElementById('avatar').textContent     = s.avatar;
  document.getElementById('step-title').textContent = s.title;
  document.getElementById('step-subtitle').textContent = step === 'otp' ? `We sent a 6-digit code to ${formData.email}` : s.sub;
  document.getElementById('pills').style.display   = step === 'details' ? 'flex' : 'none';

  if(step === 'password'){
    document.getElementById('verified-email').textContent = formData.email;
  }

  // Update back button
  const backEl = document.getElementById('back-btn');
  if(step === 'details'){
    backEl.onclick = () => { window.location.href = 'plantfox_auth_landing.html'; };
  } else {
    backEl.onclick = () => goBack();
  }

  curStep = step;
  hideError();
}

function goBack(){
  if(curStep === 'otp')      setStep('details');
  else if(curStep === 'password') setStep('otp');
  else window.location.href = 'plantfox_auth_landing.html';
}

function showError(msg){
  const el = document.getElementById('reg-error');
  if (typeof msg === 'object') {
    // Handle FastAPI style validation errors
    if (msg.detail && Array.isArray(msg.detail)) {
      msg = msg.detail.map(d => `${d.loc.join('.')}: ${d.msg}`).join(', ');
    } else if (msg.detail) {
      msg = msg.detail;
    } else {
      msg = JSON.stringify(msg);
    }
  }
  el.textContent = msg; el.classList.add('show');
}
function hideError(){ document.getElementById('reg-error').classList.remove('show'); }

function setLoading(btnId, spinnerId, v){
  document.getElementById(btnId).disabled = v;
  document.getElementById(btnId).style.display = v ? 'none' : '';
  document.getElementById(spinnerId).style.display = v ? 'inline-block' : 'none';
}

function togglePw(inputId, btn){
  const inp = document.getElementById(inputId);
  inp.type = inp.type === 'password' ? 'text' : 'password';
  btn.textContent = inp.type === 'password' ? '👁' : '🙈';
}

function updateStrength(val){
  const bars = ['bar1','bar2','bar3'];
  bars.forEach(b => { document.getElementById(b).className = 'pw-bar'; });
  if(val.length >= 4)  document.getElementById('bar1').classList.add('weak');
  if(val.length >= 8)  document.getElementById('bar2').classList.add('fair');
  if(val.length >= 12) document.getElementById('bar3').classList.add('strong');
}

// Step 1 — Send OTP
async function doSendOtp(e){
  e.preventDefault(); hideError();
  const email    = document.getElementById('reg-email').value.trim();
  const username = document.getElementById('reg-username').value.trim();
  const fullName = document.getElementById('reg-fullname').value.trim();
  if(!email || !username){ showError('Email and username are required.'); return; }
  if(username.length < 3){ showError('Username must be at least 3 characters.'); return; }

  formData = { ...formData, email, username, fullName };
  setLoading('otp-btn-text','otp-spinner',true);

  try {
    const res  = await fetch(`${API}/auth/send-otp`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ email })
    });
    const data = await res.json();
    if(!res.ok) throw data;
    setStep('otp');
    setTimeout(() => document.getElementById('reg-otp').focus(), 100);
  } catch(err){ showError(err.detail || err.message || err); }
  finally { setLoading('otp-btn-text','otp-spinner',false); }
}

// Step 2 — Verify OTP
async function doVerifyOtp(e){
  e.preventDefault(); hideError();
  const otp = document.getElementById('reg-otp').value.trim();
  if(otp.length !== 6){ showError('Please enter the full 6-digit code.'); return; }

  formData.otp = otp;
  setLoading('verify-btn-text','verify-spinner',true);

  try {
    const res  = await fetch(`${API}/auth/verify-otp`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ email: formData.email, code: otp })
    });
    const data = await res.json();
    if(!res.ok) throw data;  // Throw the whole data object so showError can handle it
    setStep('password');
    setTimeout(() => document.getElementById('reg-pw').focus(), 100);
  } catch(err){ showError(err.detail || err.message || err); }
  finally { setLoading('verify-btn-text','verify-spinner',false); }
}

// Resend OTP
async function doResend(){
  const btn = document.getElementById('resend-btn');
  btn.disabled = true; btn.textContent = 'Sending...';
  try {
    const res  = await fetch(`${API}/auth/send-otp`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ email: formData.email })
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.detail || 'Failed to resend. Try again shortly.');
    document.getElementById('reg-otp').value = '';
    hideError();
  } catch(err){ showError(err.message); }
  finally { btn.disabled=false; btn.textContent="Didn't receive it? Resend code"; }
}

// Step 3 — Register
async function doRegister(e){
  e.preventDefault(); hideError();
  const password = document.getElementById('reg-pw').value;
  const confirm  = document.getElementById('reg-cpw').value;
  if(password.length < 8){ showError('Password must be at least 8 characters.'); return; }
  if(password !== confirm){ showError('Passwords do not match.'); return; }

  setLoading('reg-btn-text','reg-spinner',true);
  try {
    const res  = await fetch(`${API}/auth/register`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        email:     formData.email,
        username:  formData.username,
        password,
        full_name: formData.fullName || undefined,
        otp:       formData.otp
      })
    });
    const data = await res.json();
    if(!res.ok) throw data;
    localStorage.setItem('pf_token', data.access_token);
    window.location.href = 'plantfox_dashboard.html';
  } catch(err){ showError(err.detail || err.message || err); }
  finally { setLoading('reg-btn-text','reg-spinner',false); }
}

// Init
if(localStorage.getItem('pf_token')) window.location.href = 'plantfox_dashboard.html';
setStep('details');
</script>
</body>
</html>
