<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PlantFox</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#16a34a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PlantFox">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800;900&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
:root {
  --fox-500:#ea6d1e;
  --gr-400:#28a85a;
  --gr-500:#16a34a;
  --gr-600:#14813b;
  --gr-700:#0e5e2b;
  --bg:#eef8f2;
  --ink:#1a1a1a;
  --ink3:#7a7a7a;
  --font:'DM Sans',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:var(--font);-webkit-tap-highlight-color:transparent;user-select:none;}

#splash{
  position:fixed;inset:0;
  background:var(--bg);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  z-index:100;
  transition:opacity .55s cubic-bezier(.4,0,.2,1),transform .55s cubic-bezier(.4,0,.2,1);
}
#splash.exit{opacity:0;transform:scale(1.04);pointer-events:none;}

.blob{position:absolute;border-radius:50%;filter:blur(60px);pointer-events:none;}
.blob-1{width:340px;height:340px;background:radial-gradient(circle,rgba(22,163,74,.18) 0%,transparent 70%);top:-60px;right:-80px;animation:bd1 7s ease-in-out infinite alternate;}
.blob-2{width:260px;height:260px;background:radial-gradient(circle,rgba(234,109,30,.13) 0%,transparent 70%);bottom:-40px;left:-60px;animation:bd2 9s ease-in-out infinite alternate;}
.blob-3{width:180px;height:180px;background:radial-gradient(circle,rgba(40,168,90,.10) 0%,transparent 70%);bottom:30%;right:-30px;animation:bd3 6s ease-in-out infinite alternate;}
@keyframes bd1{from{transform:translate(0,0) scale(1)}to{transform:translate(-20px,15px) scale(1.08)}}
@keyframes bd2{from{transform:translate(0,0) scale(1)}to{transform:translate(15px,-20px) scale(1.06)}}
@keyframes bd3{from{transform:translate(0,0)}to{transform:translate(-10px,20px)}}

.particle{position:absolute;font-size:1.1rem;opacity:0;pointer-events:none;animation:pf linear infinite;}
@keyframes pf{0%{opacity:0;transform:translateY(0) rotate(0deg) scale(.6)}10%{opacity:.7}90%{opacity:.4}100%{opacity:0;transform:translateY(-120vh) rotate(360deg) scale(1)}}

.logo-wrap{position:relative;display:flex;align-items:center;justify-content:center;margin-bottom:32px;animation:logoIn .7s cubic-bezier(.34,1.56,.64,1) .3s both;}
@keyframes logoIn{from{opacity:0;transform:scale(.5) rotate(-15deg)}to{opacity:1;transform:scale(1) rotate(0deg)}}

.orbit-ring{position:absolute;width:120px;height:120px;border-radius:50%;border:2px dashed rgba(22,163,74,.25);animation:orbit 8s linear infinite;}
@keyframes orbit{to{transform:rotate(360deg)}}
.orbit-dot{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:10px;height:10px;border-radius:50%;background:var(--gr-400);box-shadow:0 0 0 3px rgba(40,168,90,.2);}

.logo-circle{width:84px;height:84px;border-radius:50%;background:linear-gradient(135deg,var(--gr-500),var(--gr-700));display:flex;align-items:center;justify-content:center;font-size:2.4rem;box-shadow:0 4px 0 var(--gr-700),0 8px 28px rgba(22,163,74,.35),0 0 0 6px rgba(22,163,74,.1);position:relative;z-index:1;animation:breath 3s ease-in-out 1s infinite;}
@keyframes breath{0%,100%{box-shadow:0 4px 0 var(--gr-700),0 8px 28px rgba(22,163,74,.35),0 0 0 6px rgba(22,163,74,.1)}50%{box-shadow:0 4px 0 var(--gr-700),0 12px 40px rgba(22,163,74,.5),0 0 0 10px rgba(22,163,74,.12)}}

.wordmark{font-size:2.2rem;font-weight:900;color:var(--ink);letter-spacing:-.04em;line-height:1;margin-bottom:8px;animation:textIn .6s cubic-bezier(.34,1.56,.64,1) .55s both;}
.wordmark span{color:var(--fox-500);}
@keyframes textIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

.tagline{font-size:.9rem;font-weight:500;color:var(--ink3);letter-spacing:.01em;text-align:center;max-width:200px;line-height:1.5;animation:textIn .6s cubic-bezier(.34,1.56,.64,1) .7s both;}

.loading-track{position:absolute;bottom:72px;left:50%;transform:translateX(-50%);width:160px;height:4px;background:rgba(22,163,74,.12);border-radius:4px;overflow:hidden;animation:fadeUp .4s ease .9s both;}
@keyframes fadeUp{from{opacity:0;transform:translateX(-50%) translateY(8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.loading-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--gr-400),var(--fox-500));border-radius:4px;animation:loadFill 2.2s cubic-bezier(.4,0,.2,1) 1s forwards;}
@keyframes loadFill{to{width:100%}}

.skip-hint{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);font-size:.72rem;font-weight:600;color:rgba(26,26,26,.25);letter-spacing:.06em;text-transform:uppercase;animation:fadeUp .4s ease 1.5s both;cursor:pointer;padding:6px 12px;}

.pills-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:280px;margin-top:20px;animation:textIn .5s ease 1s both;}
.pill{display:inline-flex;align-items:center;gap:5px;background:white;border:1.5px solid rgba(22,163,74,.18);border-radius:999px;padding:5px 12px;font-size:.72rem;font-weight:600;color:var(--gr-700);box-shadow:0 2px 8px rgba(0,0,0,.06);animation:pillB .5s cubic-bezier(.34,1.56,.64,1) both;}
.pill:nth-child(1){animation-delay:1.0s}
.pill:nth-child(2){animation-delay:1.12s}
.pill:nth-child(3){animation-delay:1.24s}
@keyframes pillB{from{opacity:0;transform:scale(.7) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}

.version{position:absolute;top:24px;right:20px;font-size:.65rem;font-weight:700;color:rgba(22,163,74,.4);letter-spacing:.08em;text-transform:uppercase;animation:textIn .4s ease 1.2s both;}
</style>
</head>
<body>
<div id="splash">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
  <div class="version">v2.0</div>
  <div class="logo-wrap">
    <div class="orbit-ring"><div class="orbit-dot"></div></div>
    <div class="logo-circle">🦊</div>
  </div>
  <div class="wordmark">Plant<span>Fox</span></div>
  <div class="tagline">Grow Smarter with AI</div>
  <div class="pills-row">
    <div class="pill">🌱 AI Garden</div>
    <div class="pill">🔗 Blockchain</div>
    <div class="pill">🤖 Foxie AI</div>
  </div>
  <div class="loading-track"><div class="loading-fill"></div></div>
  <div class="skip-hint" id="skipBtn">TAP TO SKIP</div>
</div>
<script>
// Floating particles
const EMOJIS=['🌿','🍃','🌱','🍀','🌾','🍂'];
function spawnParticle(){
  const el=document.createElement('div');
  el.className='particle';
  el.textContent=EMOJIS[Math.floor(Math.random()*EMOJIS.length)];
  el.style.left=Math.random()*100+'vw';
  el.style.bottom='-40px';
  const dur=6+Math.random()*8;
  const delay=Math.random()*3;
  el.style.animation=`pf ${dur}s ${delay}s linear infinite`;
  document.getElementById('splash').appendChild(el);
  setTimeout(()=>el.remove(),(dur+delay+2)*1000);
}
for(let i=0;i<8;i++) setTimeout(spawnParticle,i*350);

// ── ALWAYS show splash, always redirect to auth ──
// No referrer check — splash shows every single time on mobile
function navigate(){
  const splash=document.getElementById('splash');
  splash.classList.add('exit');
  setTimeout(()=>{ window.location.href='plantfox_auth_landing.html'; },560);
}

let timer=setTimeout(navigate,3400);

document.getElementById('skipBtn').addEventListener('click',()=>{
  clearTimeout(timer);
  navigate();
});
document.getElementById('splash').addEventListener('click',(e)=>{
  if(e.target.id==='skipBtn') return;
  if(performance.now()>1000){ clearTimeout(timer); navigate(); }
});
</script>
</body>
</html>
